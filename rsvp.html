<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RSVP information for Sophia and Fintan's wedding in North Devon.">
    <meta name="theme-color" content="#fffaf0">
    <title>RSVPs — Sophia &amp; Fintan</title>
    <link rel="stylesheet" href="style.css">
    <script src="password.js"></script>
</head>

<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="home-header subpage-header">
        <nav class="site-nav subpage-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="wedding.html">The Wedding</a>
            <a href="accommodation.html">Accommodation &amp; Transport</a>
            <a href="faqs.html">FAQs</a>
            <a href="rsvp.html" aria-current="page">RSVPs</a>
        </nav>
    </header>

    <main id="main">
        <header class="page-header">
            <p class="eyebrow">We hope you can celebrate with us</p>
            <h1>RSVPs</h1>
            <p>Saturday 3 July 2027 <span aria-hidden="true">✳</span> Lee, North Devon</p>
        </header>

        <form id="rsvpForm">
  <div class="form-group">
    <label for="name">Full Name(s)</label>
    <input type="text" id="name" name="name" required placeholder="e.g., Alex Smith">
  </div>

  <div class="form-group">
    <label for="attendance">Will you be attending?</label>
    <select id="attendance" name="attendance" required>
      <option value="">Please select...</option>
      <option value="Accepts">Joyfully Accepts</option>
      <option value="Declines">Regretfully Declines</option>
    </select>
  </div>

  <div class="form-group">
    <label for="dietary">Dietary Requirements & Allergies</label>
    <input type="text" id="dietary" name="dietary" placeholder="Let us know of any specific requirements">
  </div>

  <div class="form-group">
    <label for="song">Evening Reception Song Request</label>
    <input type="text" id="song" name="song" placeholder="Artist & Track title">
  </div>

  <div class="form-group">
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required placeholder="you@example.com">
  </div>

  <button type="submit" id="submitBtn">Send RSVP</button>
</form>

<div id="formResponse" style="margin-top: 15px; font-weight: 500;"></div>


        

            <a class="link-card" href="faqs.html">Read the FAQs <span aria-hidden="true">→</span></a>
        </section>
    </main>

<script>
  // Replace with your actual Google Apps Script Web App URL
  const scriptURL = 'https://script.google.com/macros/s/AKfycbzWi61g5Yc_iXmo0IuPwo74IAWaSC8tX-ELbJNWB7dtaCcc5rkvSAi8x4CH2mkmKmHq/exec';
  
  const form = document.getElementById('rsvpForm');
  const responseDiv = document.getElementById('formResponse');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', e => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending RSVP...';

    const formData = {
      name: document.getElementById('name').value,
      attendance: document.getElementById('attendance').value,
      dietary: document.getElementById('dietary').value,
      song: document.getElementById('song').value,
      email: document.getElementById('email').value
    };

    fetch(scriptURL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(formData)
    })
    .then(() => {
      responseDiv.textContent = 'Thank you! Your RSVP has been successfully recorded.';
      responseDiv.style.color = '#2d6a4f';
      form.reset();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send RSVP';
    })
    .catch(error => {
      console.error('Submission error:', error);
      responseDiv.textContent = 'Something went wrong. Please try refreshing or reach out directly.';
      responseDiv.style.color = '#d90429';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send RSVP';
    });
  });
</script>
    
</body>
</html>
